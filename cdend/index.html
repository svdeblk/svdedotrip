        padding: 50px;

    .container {
        position: relative;

    .cutout {
        position: absolute;

        color: black;

    /* ransom notes styles */
    .style1 { background: white; font-family: 'Times New Roman', serif; font-size: 2rem; transform: rotate(-3deg); font-weight: bold; }

    .style4 { background: #ffcccc; font-family: 'Comic Sans MS', cursive; font-size: 2.5rem; transform: rotate(6deg); border-radius: 5px; }
    .style5 { background: #ccc; font-family: Impact, sans-serif; font-size: 4rem; letter-spacing: 2px; transform: rotate(-2deg); }
    
    .title {
        font-size: 4rem;
        margin-bottom: 50px;
    }
    .title span {
        display: inline-block;
        padding: 0 5px;
        background: white;
        box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }
</style>
</head>
